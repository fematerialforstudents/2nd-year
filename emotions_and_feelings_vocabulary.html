<head>
<meta charset="utf-8">

<title>Emotions & Feelings – Flashcards</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);font-family:system-ui,sans-serif;font-size:.9rem;margin:0 0 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-family:system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:.85rem}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.prog{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--mute);display:flex;justify-content:space-between;margin:6px 0 8px}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.fill{height:100%;background:var(--acc);width:0;transition:width .3s}
.scene{perspective:1000px;height:320px;margin-bottom:16px}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.back{transform:rotateY(180deg)}
.tag{font-family:system-ui,sans-serif;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);background:var(--acc2);padding:3px 10px;border-radius:999px;margin-bottom:14px}
.word{font-size:2.3rem;font-weight:700;margin:0}
.pos{color:var(--mute);font-style:italic;margin-top:6px}
.hint{position:absolute;bottom:12px;font-family:system-ui,sans-serif;font-size:.75rem;color:var(--mute)}
.big{font-size:1.9rem;font-weight:700;margin:0 0 4px;color:var(--acc)}
.ex{font-style:italic;line-height:1.4;margin-top:12px}
.exit{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--mute);margin-top:6px;line-height:1.4}
.act{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-family:system-ui,sans-serif}
.act button{border-radius:12px;padding:14px;font-size:.95rem;font-weight:600}
.no{color:var(--no);border-color:var(--no)}.ok{color:var(--ok);border-color:var(--ok)}
.nav{display:flex;justify-content:space-between;margin-top:12px;font-family:system-ui,sans-serif}
.done{text-align:center;padding:40px 10px;font-family:system-ui,sans-serif}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;font-family:system-ui,sans-serif}.chips button{padding:6px 11px;min-width:36px}
.et{font-size:1.25rem;margin:0}.step{font-family:system-ui,sans-serif;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin:2px 0 6px}.ei{margin:0 0 10px;font-weight:700}
.note{font-family:system-ui,sans-serif;font-size:.85rem;background:var(--acc2);border-radius:10px;padding:10px 12px;margin-bottom:12px;line-height:1.4}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.q{margin-bottom:8px;line-height:1.4}.bl{color:var(--acc)}
.opts,.fr{display:flex;gap:8px;flex-wrap:wrap;font-family:system-ui,sans-serif}.opts button.good{background:var(--ok);color:#fff;border-color:var(--ok)}.opts button.bad{background:var(--no);color:#fff;border-color:var(--no)}
.fr input{flex:1;min-width:120px;font:inherit;font-size:.95rem;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.res{font-family:system-ui,sans-serif;font-size:.9rem;margin-top:8px}.res.good{color:var(--ok)}.res.bad{color:var(--no)}.res.ans{color:var(--acc);font-weight:600}
.it>button{font-family:system-ui,sans-serif}.foot{align-items:center;margin-top:14px}.sc{margin-left:auto;color:var(--mute);font-size:.85rem}[hidden]{display:none!important}
</style>
</head>

 document.getElementById("score").textContent="Sapute: "+kn+" / "+D.length;
